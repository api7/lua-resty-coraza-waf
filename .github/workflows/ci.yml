name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build in manylinux_2_28 (glibc 2.28)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            quay.io/pypa/manylinux_2_28_${{ matrix.arch }} ci/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: coraza_waf-${{ matrix.arch }}
          path: prebuilt/coraza_waf-${{ matrix.arch }}.so
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:bookworm", "rockylinux:9"]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coraza_waf-${{ matrix.arch }}
          path: prebuilt
      - run: ci/smoke.sh "${{ matrix.image }}" prebuilt/coraza_waf-${{ matrix.arch }}.so

  test-nginx:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coraza_waf-${{ matrix.arch }}
          path: prebuilt
      - run: ci/test-nginx.sh prebuilt/coraza_waf-${{ matrix.arch }}.so
