name: Verify release

# Installs a published release with luarocks, on machines without Go or
# libre2, and runs the smoke test against the installed library.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: release tag, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#v}
          url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/lua-resty-coraza-waf-${version}-1.rockspec
          docker run --rm -v "$PWD/t:/t:ro" -e URL="$url" ubuntu:24.04 bash -c '
          set -e
          apt-get update -qq && apt-get install -y -qq luarocks lua5.1 luajit make curl ca-certificates >/dev/null
          if command -v go >/dev/null; then echo "go must not be installed for this test" >&2; exit 1; fi
          luarocks --lua-version=5.1 install "$URL"
          eval "$(luarocks --lua-version=5.1 path)"
          lib=$(luarocks --lua-version=5.1 config deploy_lib_dir)/coraza_waf.so
          # from /tmp, so resty.coraza comes from the installed rock
          cd /tmp && luajit /t/smoke.lua "$lib"
          '
