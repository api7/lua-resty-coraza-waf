name: Release

# Publishes vX.Y.Z: builds and tests the libraries, creates the GitHub
# release with the tarball and the rockspec, installs it back from the
# release on x86_64 and aarch64, then uploads the rockspec to LuaRocks.
#
# Triggered by a "feat: release vX.Y.Z" commit on main that touches the
# rockspec or the changelog, or by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0 or v0.1.0"
        required: true
  push:
    branches: [main]
    paths:
      - "rockspec/**"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  prepare:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat: release')"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract release version
        id: version
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          semver_re="^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$"
          if [ -n "$RELEASE_VERSION" ]; then
              [[ $RELEASE_VERSION =~ $semver_re ]] || { echo "version input is not X.Y.Z[-prerelease]"; exit 1; }
              version="${BASH_REMATCH[1]}"
          else
              title="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
              if [[ $title =~ ^(.*)\ \(#[0-9]+\)$ ]]; then
                  title="${BASH_REMATCH[1]}"
              fi
              title_re="^feat: release v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$"
              [[ $title =~ $title_re ]] || { echo "commit title is not 'feat: release vX.Y.Z'"; exit 1; }
              version="${BASH_REMATCH[1]}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if [[ $version == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify rockspec
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rockspec=rockspec/lua-resty-coraza-waf-${VERSION}-1.rockspec
          test -f "$rockspec" || { echo "$rockspec not found"; exit 1; }
          grep -q "^version = \"${VERSION}-1\"$" "$rockspec"
          grep -q "/releases/download/v${VERSION}/lua-resty-coraza-waf-${VERSION}.tar.gz\"" "$rockspec"

      - name: Extract changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(r"^## \[" + re.escape(version) + r"\](?:\s+-\s+.*)?\s*$")
          start = next((i + 1 for i, l in enumerate(lines) if heading.match(l)), None)
          if start is None:
              raise SystemExit("CHANGELOG.md has no '## [" + version + "]' section")
          end = next((i for i in range(start, len(lines)) if re.match(r"^## \[", lines[i])), len(lines))
          body = "\n".join(lines[start:end]).strip()
          if not body:
              raise SystemExit("CHANGELOG.md section for " + version + " is empty")
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Validate LuaRocks token
        env:
          LUAROCKS_TOKEN: ${{ secrets.LUAROCKS_TOKEN }}
        run: |
          if [ -z "$LUAROCKS_TOKEN" ]; then
              echo "LUAROCKS_TOKEN secret is not configured"
              exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md "${flags[@]}"

  verify:
    needs: [prepare, release]
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  luarocks:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload to LuaRocks
        env:
          LUAROCKS_TOKEN: ${{ secrets.LUAROCKS_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luarocks lua5.1 >/dev/null
          luarocks --lua-version=5.1 install --local dkjson
          eval "$(luarocks --lua-version=5.1 path)"
          mkdir -p "$HOME/.luarocks"
          chmod 700 "$HOME/.luarocks"
          lua5.1 -e 'local f = assert(io.open(os.getenv("HOME") .. "/.luarocks/upload_config.lua", "w")); f:write(("key = %q\n"):format(os.getenv("LUAROCKS_TOKEN"))); f:write("server = \"https://luarocks.org\"\nversion = \"1.0\"\n"); f:close()'
          chmod 600 "$HOME/.luarocks/upload_config.lua"
          # the tarball stays on the GitHub release; only the rockspec goes to LuaRocks
          luarocks --lua-version=5.1 upload --skip-pack "dist/lua-resty-coraza-waf-${VERSION}-1.rockspec"
